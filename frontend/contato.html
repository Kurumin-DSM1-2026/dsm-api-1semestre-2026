<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./styles/styles.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Contato - Crédito Fácil</title>
    <link rel="shortcut icon" href="./imgs/favicon.png" type="image/x-icon">
</head>
<body>
        <nav class="nav flex-column">
      <div class="nav-logo"></div>
      <a class="nav-link" href="./index.html">Dashboard</a>
      <a class="nav-link" href="./institucional.html">Institucional</a>
      <a class="nav-link active" href="./contato.html">Contato</a>
      <button class="nav-link menu-btn" data-bs-toggle="collapse" data-bs-target="#nav-menu" aria-expanded="false">&#9776;</button>
      <div class="menu collapse" id="nav-menu">
        <a class="menu-item" href="./index.html">Dashboard</a>
        <a class="menu-item" href="./institucional.html">Institucional</a>
        <a class="menu-item" href="./contato.html">Contato</a>
      </div>
      <a class="nav-admin" href="./admin.html" title="Área restrita" aria-label="Área restrita">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
      </a>
    </nav>
    <div class="contentWrapper">
        <section>
            <div class="contentWrapper-header">
                <h1>Contato</h1>
                Deixe uma pergunta, sugestão ou crítica sobre o painel.
            </div>
        </section>
        <section>
            <div class="card">
                <div class="card-body">
                    <form id="formContato" novalidate>
                        <div class="mb-3">
                            <label for="campoNome" class="form-label">Nome</label>
                            <input type="text" class="form-control" id="campoNome" name="nome" maxlength="100" required>
                        </div>
                        <div class="mb-3">
                            <label for="campoEmail" class="form-label">E-mail</label>
                            <input type="email" class="form-control" id="campoEmail" name="email" maxlength="150" required>
                        </div>
                        <div class="mb-3">
                            <label for="campoTipo" class="form-label">Tipo</label>
                            <select class="form-select" id="campoTipo" name="tipo" required>
                                <option value="pergunta">Pergunta</option>
                                <option value="sugestao">Sugestão</option>
                                <option value="critica">Crítica</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="campoMensagem" class="form-label">Mensagem</label>
                            <textarea class="form-control" id="campoMensagem" name="mensagem" rows="5" maxlength="2000" required></textarea>
                        </div>
                        <div style="position:absolute;left:-9999px;" aria-hidden="true">
                            <label for="campoEmpresa">Empresa</label>
                            <input type="text" id="campoEmpresa" name="empresa" tabindex="-1" autocomplete="off">
                        </div>
                        <button type="submit" class="btn btn-primary" id="botaoEnviar">Enviar</button>
                        <div id="avisoContato" class="mt-3" role="status" aria-live="polite"></div>
                    </form>
                </div>
            </div>
        </section>
    </div>
</body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
<script src="./js/contato.js"></script>
</html>
