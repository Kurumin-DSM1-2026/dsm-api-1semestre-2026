    <div class="contentWrapper">
        <section>
            <div class="contentWrapper-header">
                <h1>Comentários recebidos</h1>
                Área restrita. Digite a senha para consultar o banco.
            </div>
        </section>
        <section>
            <div class="card">
                <div class="card-body">
                    <form id="formAdmin" class="row g-2 align-items-end" novalidate>
                        <div class="col-sm-6 col-md-4">
                            <label for="campoSenha" class="form-label">Senha</label>
                            <input type="password" class="form-control" id="campoSenha" autocomplete="current-password" required>
                        </div>
                        <div class="col-auto">
                            <button type="submit" class="btn btn-primary" id="botaoConsultar">Consultar</button>
                        </div>
                    </form>
                    <div id="avisoAdmin" class="mt-3" role="status" aria-live="polite"></div>
                    <pre id="consultaAdmin" class="mt-3 mb-2" hidden></pre>
                    <div class="table-responsive">
                        <table class="table table-striped table-sm" id="tabelaAdmin" hidden>
                            <thead></thead>
                            <tbody></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </section>
    </div>
</body>
