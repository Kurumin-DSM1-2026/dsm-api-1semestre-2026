services:
  banco:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - dados_banco:/var/lib/mysql
      - ./backend/app/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12

  site:
    build:
      context: .
      dockerfile: backend/app/Dockerfile
    restart: unless-stopped
    depends_on:
      banco:
        condition: service_healthy
    environment:
      DB_HOST: banco
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      ADMIN_SENHA: ${ADMIN_SENHA}
    ports:
      - "5000:5000"

volumes:
  dados_banco:
